[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.10.2"
diesel = { version = "2.2.10", features = ["r2d2", "postgres", "uuid", "chrono"] }
dotenv = "0.15.0"
env_logger = "0.11.8"
r2d2 = "0.8.10"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
log = "0.4.27"
jsonwebtoken = "9.3.1"
actix-cors = "0.7.1"
sha2 = "0.10.9"
hex = "0.4.3"
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.16.0", features = ["serde", "v4"] }
validator = { version = "0.20.0", features = ["derive"] }
lazy_static = "1.5.0"
regex = "1.11.1"
ts-rs = { version = "10.1.0", features = ["uuid-impl", "chrono-impl"] }
time = "0.3.41"
actix-web-httpauth = "0.8.2"
actix-multipart = "0.7.2"
futures = "0.3.31"
reqwest = { version = "0.12.15", features = ["multipart", "json"] }

[build-dependencies]

[dev-dependencies]
